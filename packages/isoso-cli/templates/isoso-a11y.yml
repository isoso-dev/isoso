name: Isoso accessibility

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Isoso scan
        run: npx isoso scan --format json --fail-on serious -o isoso-report.json

      - name: Upload Isoso report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isoso-report
          path: isoso-report.json
          if-no-files-found: ignore
